[project]
name = "cv-frame"
version = "0.1.0"
description = "Cogniventure Core Architecture: microsserviços com trilhos para engenharia assistida por IA."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1",
    "fastapi>=0.142",
    "httpx>=0.28",
    "nats-py>=2.16",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "pyjwt[crypto]>=2.15",
    "pyyaml>=6.0",
    "surrealdb>=2.0",
    "temporalio>=1.34",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = ["pytest>=9.1"]

[tool.pytest.ini_options]
# Testes são importados pelo caminho (tests.core, tests.billing): nunca escondem core/ ou um serviço.
addopts = "--import-mode=importlib"
