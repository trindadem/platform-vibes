# svc-processos · rotas públicas no Gateway. Fonte da verdade: specs/processos.md §2
service: processos
base_path: /api/v1/processos

live:
  - topic: processos                # um processo foi sugerido, aceito, recusado ou descrito
    model: ProcessoMudou
  - topic: desenho                  # o rascunho mudou, chegou mensagem, publicou, ajustou ou descartou
    model: DesenhoMudou
  - topic: execucoes                # uma execução começou, andou ou terminou
    model: ExecucaoMudou
  - topic: tarefas                  # uma tarefa de pessoa foi criada ou resolvida
    model: TarefaMudou
  - topic: regras                   # o staff ensinou uma regra a um passo, ou ela foi avaliada
    model: RegraMudou

endpoints:
  - path: /biblioteca
    method: GET
    auth: client_jwt
    response: Biblioteca
    target_type: http
    target_url: http://svc-processos:8000/biblioteca

  - path: /processos
    name: listar
    method: GET
    auth: client_jwt
    query: ProcessoQuery
    response: ProcessoPage
    target_type: http
    target_url: http://svc-processos:8000/processos

  - path: /resumo
    method: GET
    auth: client_jwt
    response: Resumo
    target_type: http
    target_url: http://svc-processos:8000/resumo

  - path: /descoberta
    method: POST
    auth: client_jwt
    stream: true                    # os passos do agente em pedaços; as sugestões no fim
    request: Empty
    delta: PassoAgente
    response: Descoberta
    target_type: http
    target_url: http://svc-processos:8000/descoberta
    timeout: 120

  - path: /descrever
    method: POST
    auth: client_jwt
    request: Descricao
    response: Processo
    target_type: http
    target_url: http://svc-processos:8000/descrever
    timeout: 120

  - path: /processos/aceitar
    method: POST
    auth: client_jwt
    request: ProcessoRef
    response: Processo
    target_type: http
    target_url: http://svc-processos:8000/processos/aceitar

  - path: /processos/recusar
    method: POST
    auth: client_jwt
    request: ProcessoRef
    response: Processo
    target_type: http
    target_url: http://svc-processos:8000/processos/recusar

  - path: /catalogo
    name: catalogo
    method: GET
    auth: client_jwt
    response: CatalogoAcoes
    target_type: http
    target_url: http://svc-processos:8000/catalogo

  - path: /desenho/abrir
    name: abrirDesenho
    method: POST
    auth: client_jwt
    request: DesenhoRef
    response: Desenho
    target_type: http
    target_url: http://svc-processos:8000/desenho/abrir

  - path: /desenho/mensagem
    name: mensagemDesenho
    method: POST
    auth: client_jwt
    request: MensagemDesenhoIn
    response: Desenho
    target_type: http
    target_url: http://svc-processos:8000/desenho/mensagem
    stream: true
    delta: PassoAgente
    timeout: 120

  - path: /desenho/simular
    name: simular
    method: POST
    auth: client_jwt
    request: SimulacaoIn
    response: Simulacao
    target_type: http
    target_url: http://svc-processos:8000/desenho/simular

  - path: /desenho/desfazer
    name: desfazer
    method: POST
    auth: client_jwt
    request: DesenhoRef
    response: Desenho
    target_type: http
    target_url: http://svc-processos:8000/desenho/desfazer

  - path: /desenho/publicar
    name: publicar
    method: POST
    auth: client_jwt
    request: DesenhoRef
    response: Desenho
    target_type: http
    target_url: http://svc-processos:8000/desenho/publicar
    timeout: 60

  - path: /desenho/ajustar
    name: ajustar
    method: POST
    auth: client_jwt
    request: DesenhoRef
    response: Desenho
    target_type: http
    target_url: http://svc-processos:8000/desenho/ajustar

  - path: /desenho/descartar
    name: descartar
    method: POST
    auth: client_jwt
    request: DesenhoRef
    response: Desenho
    target_type: http
    target_url: http://svc-processos:8000/desenho/descartar

  - path: /execucoes
    method: GET
    auth: client_jwt
    query: ExecucaoQuery
    response: ExecucaoPage
    target_type: http
    target_url: http://svc-processos:8000/execucoes

  - path: /execucoes/item
    name: execucao
    method: GET
    auth: client_jwt
    query: ExecucaoRef
    response: ExecucaoDetalhe
    target_type: http
    target_url: http://svc-processos:8000/execucoes/item

  - path: /execucoes/iniciar
    name: iniciar
    method: POST
    auth: client_jwt
    request: Iniciar
    response: Execucao
    target_type: http
    target_url: http://svc-processos:8000/execucoes/iniciar
    timeout: 30

  - path: /tarefas
    method: GET
    auth: client_jwt
    query: TarefaQuery
    response: TarefaPage
    target_type: http
    target_url: http://svc-processos:8000/tarefas

  - path: /tarefas/responder
    name: responder
    method: POST
    auth: client_jwt
    request: Resposta
    response: Tarefa
    target_type: http
    target_url: http://svc-processos:8000/tarefas/responder
    timeout: 30

  - path: /acompanhamento
    method: GET
    auth: client_jwt
    response: Acompanhamento
    target_type: http
    target_url: http://svc-processos:8000/acompanhamento

  - path: /desenho/revisao
    name: pedirRevisao
    method: POST
    auth: client_jwt
    request: RevisaoIn
    response: Desenho
    target_type: http
    target_url: http://svc-processos:8000/desenho/revisao

  - path: /desenho/aprovar
    name: aprovarRevisao
    method: POST
    auth: client_jwt
    request: DesenhoRef
    response: Desenho
    target_type: http
    target_url: http://svc-processos:8000/desenho/aprovar
    timeout: 60

  - path: /desenho/devolver
    name: devolver
    method: POST
    auth: client_jwt
    request: Devolucao
    response: Desenho
    target_type: http
    target_url: http://svc-processos:8000/desenho/devolver

  - path: /desenho/ajuda
    name: pedirAjuda
    method: POST
    auth: client_jwt
    request: AjudaIn
    response: Desenho
    target_type: http
    target_url: http://svc-processos:8000/desenho/ajuda

  - path: /desenho/ajuda/concluir
    name: concluirAjuda
    method: POST
    auth: client_jwt
    request: DesenhoRef
    response: Desenho
    target_type: http
    target_url: http://svc-processos:8000/desenho/ajuda/concluir

  - path: /regras
    method: GET
    auth: client_jwt
    query: RegraQuery
    response: Regras
    target_type: http
    target_url: http://svc-processos:8000/regras

  - path: /regras/desativar
    name: desativarRegra
    method: POST
    auth: client_jwt
    request: RegraRef
    response: Regra
    target_type: http
    target_url: http://svc-processos:8000/regras/desativar
