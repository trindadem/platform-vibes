# svc-integracoes · rotas públicas no Gateway. Fonte da verdade: specs/integracoes.md §2
service: integracoes
base_path: /api/v1/integracoes

live:
  - topic: conexoes                 # uma conexão foi feita ou removida
    model: ConexaoMudou
  - topic: documentos               # chegou um documento na caixa de entrada
    model: DocumentoMudou
  - topic: pagamentos               # o banco agendou ou confirmou um pagamento
    model: PagamentoMudou
  - topic: cobrancas                # o banco emitiu uma cobrança ou recebeu o pagamento dela
    model: CobrancaMudou
  - topic: enviados                 # saiu um e-mail da caixa de entrada
    model: EnviadoMudou
  - topic: servidores               # servidor MCP conectado, atualizado, removido ou com ferramenta em quarentena
    model: ServidorMudou

endpoints:
  - path: /conexoes
    method: GET
    auth: client_jwt
    response: Conexoes
    target_type: http
    target_url: http://svc-integracoes:8000/conexoes

  - path: /conexoes
    name: conectar
    method: POST
    auth: client_jwt
    request: NovaConexao
    response: Conexao
    target_type: http
    target_url: http://svc-integracoes:8000/conexoes

  - path: /conexoes/remover
    name: desconectar
    method: POST
    auth: client_jwt
    request: ConexaoRef
    response: Conexao
    target_type: http
    target_url: http://svc-integracoes:8000/conexoes/remover

  - path: /resumo
    method: GET
    auth: client_jwt
    response: Resumo
    target_type: http
    target_url: http://svc-integracoes:8000/resumo

  - path: /documentos
    method: GET
    auth: client_jwt
    query: DocumentoQuery
    response: DocumentoPage
    target_type: http
    target_url: http://svc-integracoes:8000/documentos

  - path: /documentos/arquivo
    name: arquivo
    method: GET
    auth: client_jwt
    query: DocumentoRef
    response: Link
    target_type: http
    target_url: http://svc-integracoes:8000/documentos/arquivo

  - path: /documentos/upload
    name: documentoUpload
    method: POST
    auth: client_jwt
    request: UploadRequest
    response: Upload
    target_type: http
    target_url: http://svc-integracoes:8000/documentos/upload

  - path: /documentos/enviar
    name: enviarDocumento
    method: POST
    auth: client_jwt
    request: EnviarDocumento
    response: Documento
    target_type: http
    target_url: http://svc-integracoes:8000/documentos/enviar

  - path: /entrada/postmark         # o Postmark avisa que chegou um e-mail (Basic auth na URL do webhook)
    name: entradaPostmark
    method: POST
    auth: public
    request: AvisoPostmark
    response: Recebidos
    headers: [authorization]
    max_body_mb: 40                 # até 35 MB de mensagem, com os anexos em base64
    timeout: 60
    target_type: http
    target_url: http://svc-integracoes:8000/entrada/postmark

  - path: /pagamentos
    method: GET
    auth: client_jwt
    query: PagamentoQuery
    response: PagamentoPage
    target_type: http
    target_url: http://svc-integracoes:8000/pagamentos

  - path: /pagamentos/confirmar
    name: confirmarPagamento
    method: POST
    auth: client_jwt
    request: PagamentoRef
    response: Pagamento
    target_type: http
    target_url: http://svc-integracoes:8000/pagamentos/confirmar

  - path: /catalogo
    method: GET
    auth: client_jwt
    response: Catalogo
    target_type: http
    target_url: http://svc-integracoes:8000/catalogo

  - path: /servidores
    method: GET
    auth: client_jwt
    response: ServidoresMcp
    target_type: http
    target_url: http://svc-integracoes:8000/servidores

  - path: /servidores
    name: conectarServidor
    method: POST
    auth: client_jwt
    request: NovoServidorMcp
    response: ServidorMcp
    timeout: 60                     # conecta e lista as ferramentas do servidor
    target_type: http
    target_url: http://svc-integracoes:8000/servidores

  - path: /servidores/atualizar
    name: atualizarServidor
    method: POST
    auth: client_jwt
    request: ServidorRef
    response: ServidorMcp
    timeout: 60
    target_type: http
    target_url: http://svc-integracoes:8000/servidores/atualizar

  - path: /servidores/remover
    name: removerServidor
    method: POST
    auth: client_jwt
    request: ServidorRef
    response: ServidorMcp
    target_type: http
    target_url: http://svc-integracoes:8000/servidores/remover

  - path: /cobrancas
    method: GET
    auth: client_jwt
    query: CobrancaQuery
    response: CobrancaPage
    target_type: http
    target_url: http://svc-integracoes:8000/cobrancas

  - path: /cobrancas/confirmar
    name: confirmarCobranca
    method: POST
    auth: client_jwt
    request: CobrancaRef
    response: Cobranca
    target_type: http
    target_url: http://svc-integracoes:8000/cobrancas/confirmar

  - path: /enviados
    method: GET
    auth: client_jwt
    query: EnviadoQuery
    response: EnviadoPage
    target_type: http
    target_url: http://svc-integracoes:8000/enviados
