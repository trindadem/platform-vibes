# svc-staff · rotas públicas no Gateway. Fonte da verdade: specs/staff.md §2
service: staff
base_path: /api/v1/staff

live:
  - topic: fila                     # chegou, mudou ou subiu (prazo) um item da fila do staff
    model: FilaMudou
  - topic: carteiras                # o gestor atribuiu ou tirou um cliente de uma carteira
    model: CarteiraMudou

endpoints:
  - path: /resumo
    method: GET
    auth: client_jwt
    response: Resumo
    target_type: http
    target_url: http://svc-staff:8000/resumo

  - path: /clientes
    method: GET
    auth: client_jwt
    response: Clientes
    target_type: http
    target_url: http://svc-staff:8000/clientes
    timeout: 30

  - path: /clientes
    name: novoCliente
    method: POST
    auth: client_jwt
    request: NovoCliente
    response: Cliente
    target_type: http
    target_url: http://svc-staff:8000/clientes
    timeout: 30

  - path: /clientes/convite
    name: convidarDono
    method: POST
    auth: client_jwt
    request: ClienteRef
    response: Cliente
    target_type: http
    target_url: http://svc-staff:8000/clientes/convite
    timeout: 30

  # A conta do cliente (alinhamento pós-N7, itens 2 e 13): mensalidade, vencimento, suspensão e encerramento.
  - path: /clientes/cobranca
    name: cobranca
    method: POST
    auth: client_jwt
    request: CobrancaCliente
    response: Cliente
    target_type: http
    target_url: http://svc-staff:8000/clientes/cobranca

  - path: /clientes/situacao
    name: situacaoCliente
    method: POST
    auth: client_jwt
    request: SituacaoCliente
    response: Cliente
    target_type: http
    target_url: http://svc-staff:8000/clientes/situacao

  - path: /organizacoes
    method: GET
    auth: client_jwt
    response: Organizacoes
    target_type: http
    target_url: http://svc-staff:8000/organizacoes

  - path: /carteiras
    method: GET
    auth: client_jwt
    response: Carteiras
    target_type: http
    target_url: http://svc-staff:8000/carteiras

  - path: /carteiras
    name: atribuirCarteira
    method: POST
    auth: client_jwt
    request: NovaCarteira
    response: Carteira
    target_type: http
    target_url: http://svc-staff:8000/carteiras

  - path: /carteiras/remover
    name: removerCarteira
    method: POST
    auth: client_jwt
    request: CarteiraRef
    response: Carteira
    target_type: http
    target_url: http://svc-staff:8000/carteiras/remover

  - path: /carteira
    method: GET
    auth: client_jwt
    response: MinhaCarteira
    target_type: http
    target_url: http://svc-staff:8000/carteira
    timeout: 30

  - path: /fila
    method: GET
    auth: client_jwt
    query: FilaQuery
    response: FilaPage
    target_type: http
    target_url: http://svc-staff:8000/fila

  - path: /fila/assumir
    name: assumir
    method: POST
    auth: client_jwt
    request: ItemRef
    response: ItemFila
    target_type: http
    target_url: http://svc-staff:8000/fila/assumir

  - path: /fila/atribuir
    name: atribuir
    method: POST
    auth: client_jwt
    request: Atribuicao
    response: ItemFila
    target_type: http
    target_url: http://svc-staff:8000/fila/atribuir

  - path: /fila/detalhe
    method: GET
    auth: client_jwt
    query: ItemRef
    response: FilaDetalhe
    target_type: http
    target_url: http://svc-staff:8000/fila/detalhe
    timeout: 30

  - path: /fila/resolver
    name: resolver
    method: POST
    auth: client_jwt
    request: ResolverExcecao
    response: ItemFila
    target_type: http
    target_url: http://svc-staff:8000/fila/resolver
    timeout: 30

  - path: /fila/revisao
    name: decidir
    method: POST
    auth: client_jwt
    request: DecidirRevisao
    response: ItemFila
    target_type: http
    target_url: http://svc-staff:8000/fila/revisao
    timeout: 60

  - path: /fila/responder
    name: responder
    method: POST
    auth: client_jwt
    request: ResponderPedido
    response: ItemFila
    target_type: http
    target_url: http://svc-staff:8000/fila/responder
    timeout: 30

  - path: /numeros
    method: GET
    auth: client_jwt
    query: NumerosQuery
    response: Numeros
    target_type: http
    target_url: http://svc-staff:8000/numeros
