# Nível 1 com tela: a página compõe indicadores e a lista, só com o catálogo.
id: metas-painel
level: 1
service: metas
title: Metas com painel de indicadores
spec: |
  # Spec: metas

  ## 1. Objetivo Operacional
  Metas da equipe com um painel: quantas metas existem e quantas estão concluídas.
  Módulo (schemas.MODULE): título "Metas", descrição "Metas e resultados", categoria "Gestão".

  ## 2. Contrato de Entrada e Saída
  - Cadastro `metas` (Resource, título "Metas"), modelo `Meta`:
    - `nome`: texto obrigatório, 2 a 120 caracteres, título "Meta";
    - `alvo`: número >= 0, título "Alvo";
    - `atual`: número >= 0, padrão 0, título "Atual";
    - `concluida`: bool, padrão false, título "Concluída".
  - Busca em nome; filtro por concluida; ordem por nome.
  - Substitua o cadastro `registros` do esqueleto por `metas` (a ação /execute cria uma meta com nome = title e alvo 0).
  - Tela do módulo (frontend/src/modules/metas/page.tsx): acima da lista, um Grid com dois Stat: "Metas" (o total de
    useQuery(metas.metas.list)) e "Concluídas" (o total de useQuery(metas.metas.list, { concluida: true })), depois a
    lista com ResourceList e useResource(metas.metas). Só componentes do catálogo (README §6).

  ## 3. Fluxo de Execução
  1. Persistência SurrealDB — metas_metas, por organização.

  ## 4. Casos de Borda e Erros Mapeados
  - 422: alvo negativo.
acceptance: |
  from pathlib import Path

  from core.testing import service_app


  def test_metas_pelas_rotas():
      async def cenario(app):
          ana = app.user("ana", "acme", "owner")
          assert (await ana.post("/metas", json={"nome": "Vender 100 bolos", "alvo": 100})).status_code == 200
          assert (await ana.post("/metas", json={"nome": "Abrir 2 lojas", "alvo": 2, "atual": 2, "concluida": True})).status_code == 200
          assert (await ana.post("/metas", json={"nome": "Ruim", "alvo": -1})).status_code == 422
          feitas = await ana.get("/metas", params={"concluida": "true"})
          assert [m["nome"] for m in feitas.json()["data"]["items"]] == ["Abrir 2 lojas"]
          criada = await ana.post("/execute", json={"title": "Pela ação"})
          assert criada.status_code == 200, criada.text
          assert (await ana.get("/metas")).json()["data"]["total"] == 3

      service_app(cenario)


  def test_painel_na_tela():
      tela = Path("frontend/src/modules/metas/page.tsx").read_text()
      assert tela.count("<Stat") == 2 and "<Grid" in tela and "<ResourceList" in tela and "useResource(metas.metas)" in tela
