    """svc-agenda · contratos (DTOs, enums, constantes). Fonte da verdade: specs/agenda.md §2"""
    from datetime import date
    from typing import Literal

    from pydantic import BaseModel, ConfigDict, Field

    from core.plans import Module
    from core.resources import Fields, Resource

    # Nomes canônicos gerados pelo service.sh — literais de propósito: um grep acha tudo.
    SERVICE = "svc-agenda"
    TASK_QUEUE = "agenda-queue"

    MODULE = Module("Agenda", "Lembretes e prazos", category="Organização")


    class Lembrete(Fields):
        titulo: str = Field(..., min_length=2, max_length=120, title="Título")
        data: date = Field(..., title="Data")
        status: Literal["pendente", "feito", "atrasado"] = Field("pendente", title="Status")


    LEMBRETES = Resource(SERVICE, "lembretes", Lembrete, "Lembretes", sort=("data",), filters=("status",))
    RESOURCES = [LEMBRETES]


    class Empty(BaseModel):
        model_config = ConfigDict(extra="forbid")


    class Atrasados(BaseModel):
        total: int
  services/svc-agenda/service.py: |
    """svc-agenda · lógica de negócio pura. Fonte da verdade: specs/agenda.md §3"""
    from datetime import UTC, datetime

    from core.security import acting_as, system
    from core.surreal import Migration, db
    from core.temporal_runner import activities

    from schemas import LEMBRETES, SERVICE, Atrasados, Empty

    MIGRATIONS: list[Migration] = []


    @activities("agenda")
    class AgendaService:
        async def marcar_atrasados(self, data: Empty) -> Atrasados:
            """Em cada organização, os pendentes de data passada viram atrasados."""
            hoje = datetime.now(UTC).date().isoformat()
            total = 0
            for org in await db.tenants(LEMBRETES.table):
                with acting_as(system(SERVICE, org)):
                    mudados = await db.query(
                        "UPDATE agenda_lembretes SET status = 'atrasado' WHERE tenant = $tenant AND status = 'pendente' AND data < $hoje RETURN AFTER",
                        hoje=hoje,
                    )
                    total += len(mudados or [])
            return Atrasados(total=total)
  services/svc-agenda/workflows.py: |
    """svc-agenda · orquestração durável. Fonte da verdade: specs/agenda.md §3"""
    from datetime import timedelta

    from temporalio import workflow
    from temporalio.common import RetryPolicy

    with workflow.unsafe.imports_passed_through():
        from core.temporal_runner import Schedule
        from schemas import Atrasados, Empty
        from service import AgendaService


    @workflow.defn
    class AtrasadosWorkflow:
        @workflow.run
        async def run(self, data: Empty) -> Atrasados:
            return await workflow.execute_activity_method(
                AgendaService.marcar_atrasados,
                data,
                start_to_close_timeout=timedelta(minutes=5),
                retry_policy=RetryPolicy(maximum_attempts=3),
            )


    SCHEDULES = [Schedule("atrasados", "0 9 * * *", AtrasadosWorkflow.run, Empty(), timezone="America/Sao_Paulo")]
  services/svc-agenda/main.py: |
    """svc-agenda · ingress duplo + worker Temporal no mesmo loop. Fonte da verdade: specs/agenda.md

    HTTP /lembretes... → cadastro declarado em schemas.RESOURCES (core/resources.py).
    Temporal: AtrasadosWorkflow todo dia às 9h (workflows.SCHEDULES).

    Rodar (da raiz): uv run python -m uvicorn --app-dir services/svc-agenda main:app --port 8100 --env-file .env
    """
    from contextlib import asynccontextmanager

    from fastapi import FastAPI

    from core.envelope import install_envelope
    from core.nats_bus import bus
    from core.plans import plans
    from core.resources import resources
    from core.security import install_security
    from core.surreal import db
    from core.telemetry import install_telemetry
    from core.temporal_runner import runner

    from schemas import MODULE, RESOURCES, SERVICE, TASK_QUEUE
    from service import MIGRATIONS, AgendaService
    from workflows import SCHEDULES, AtrasadosWorkflow

    svc = AgendaService()


    @asynccontextmanager
    async def lifespan(app: FastAPI):
        async with (
            bus.connected(SERVICE),
            db.connected(resources=RESOURCES, migrations=MIGRATIONS, service=SERVICE),
            runner.worker(TASK_QUEUE, workflows=[AtrasadosWorkflow], service=svc, schedules=SCHEDULES),
        ):
            await plans.declare(MODULE)
            yield


    app = FastAPI(title=SERVICE, lifespan=lifespan)
    install_envelope(app, service=SERVICE)
    install_security(app, service=SERVICE)
    install_telemetry(app, service=SERVICE)
    resources.mount(app, RESOURCES)
