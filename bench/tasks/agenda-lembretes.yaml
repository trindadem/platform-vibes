# Nível 3: agendamento diário que passa por todas as organizações.
id: agenda-lembretes
level: 3
service: agenda
title: Lembretes com agendamento diário de atrasados
spec: |
  # Spec: agenda

  ## 1. Objetivo Operacional
  Lembretes com data; todo dia às 9h (America/Sao_Paulo) os pendentes de data passada viram atrasados.
  Módulo (schemas.MODULE): título "Agenda", descrição "Lembretes e prazos", categoria "Organização".

  ## 2. Contrato de Entrada e Saída
  - Cadastro `lembretes` (Resource, título "Lembretes"), modelo `Lembrete`:
    - `titulo`: texto obrigatório, 2 a 120 caracteres, título "Título";
    - `data`: data (date) obrigatória, título "Data";
    - `status`: "pendente" | "feito" | "atrasado", padrão "pendente", título "Status".
  - Filtro por status; ordem por data.
  - Activity `marcar_atrasados(Empty) -> Atrasados { total: int }` (Empty: modelo sem campos): para cada organização
    com lembretes (db.tenants), como system(SERVICE, org), muda para "atrasado" os "pendente" com data anterior a hoje
    (UTC) e soma quantos mudaram. Pode usar db.query com $tenant (UPDATE ... WHERE tenant = $tenant ...).
  - workflows.py: `AtrasadosWorkflow` que executa marcar_atrasados (timeout 5 min, 3 tentativas) e
    SCHEDULES = [Schedule("atrasados", "0 9 * * *", AtrasadosWorkflow.run, Empty(), timezone="America/Sao_Paulo")].
    O main.py registra o workflow novo no worker. Substitua o cadastro `registros` e a ação /execute do esqueleto: o
    módulo só tem o cadastro lembretes e o agendamento (sem /execute, sem gatilho, sem o workflow antigo).
  - Tela do módulo: os lembretes com ResourceList.

  ## 3. Fluxo de Execução
  1. Persistência SurrealDB — agenda_lembretes, por organização.
  2. Temporal — AtrasadosWorkflow → activity agenda.marcar_atrasados, agendado todo dia às 9h.

  ## 4. Casos de Borda e Erros Mapeados
  - Lembrete feito nunca vira atrasado; de hoje ou futuro continua pendente.
acceptance: |
  from datetime import UTC, datetime, timedelta

  from core.security import acting_as, system
  from core.testing import service_app


  def test_agendamento_declarado():
      import workflows

      [s] = workflows.SCHEDULES
      assert (s.id, s.cron, s.timezone) == ("atrasados", "0 9 * * *", "America/Sao_Paulo")
      assert s.workflow == workflows.AtrasadosWorkflow.run


  def test_marcar_atrasados_em_todas_as_organizacoes():
      ontem = (datetime.now(UTC).date() - timedelta(days=1)).isoformat()
      hoje = datetime.now(UTC).date().isoformat()

      async def cenario(app):
          ana, bia = app.user("ana", "acme", "owner"), app.user("bia", "beta", "owner")
          for cliente, titulo, data, status in ((ana, "Pagar aluguel", ontem, "pendente"), (ana, "Ligar", ontem, "feito"),
                                                (ana, "Hoje", hoje, "pendente"), (bia, "Beta atrasado", ontem, "pendente")):
              r = await cliente.post("/lembretes", json={"titulo": titulo, "data": data, "status": status})
              assert r.status_code == 200, r.text
          import schemas
          with acting_as(system("svc-agenda")):
              resultado = await app.main.svc.marcar_atrasados(schemas.Empty())
          assert resultado.total == 2
          atrasados = await ana.get("/lembretes", params={"status": "atrasado"})
          assert [l["titulo"] for l in atrasados.json()["data"]["items"]] == ["Pagar aluguel"]
          assert (await bia.get("/lembretes", params={"status": "atrasado"})).json()["data"]["total"] == 1
          assert (await ana.post("/execute", json={"title": "x"})).status_code in (404, 405)

      service_app(cenario)
