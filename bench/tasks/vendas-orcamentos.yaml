# Nível 2: ação com regra de estado e de papel.
id: vendas-orcamentos
level: 2
service: comercial
title: Orçamentos com aprovação por papel
spec: |
  # Spec: comercial

  ## 1. Objetivo Operacional
  Orçamentos comerciais: a equipe cadastra e aprova; desconto acima de 10% só com dono ou administrador.
  Módulo (schemas.MODULE): título "Comercial", descrição "Orçamentos e propostas", categoria "Comercial".

  ## 2. Contrato de Entrada e Saída
  - Cadastro `orcamentos` (Resource, título "Orçamentos"), modelo `Orcamento`:
    - `cliente`: texto obrigatório, 2 a 120 caracteres, título "Cliente";
    - `valor`: Money com gt=0, título "Valor";
    - `desconto`: número de 0 a 100 (percentual), padrão 0, título "Desconto (%)";
    - `status`: "rascunho" | "aprovado" | "recusado", padrão "rascunho", título "Status".
  - Busca em cliente; filtro por status; ordem por valor.
  - POST /aprovar (`Aprovacao { id }`) → `OrcamentoItem` com status "aprovado" (name: aprovar no manifesto).
  - O cadastro `registros`, a ação /execute, o gatilho e o workflow do esqueleto continuam como estão.
  - Tela: frontend/src/modules/comercial/orcamentos/page.tsx (subtela /comercial/orcamentos, título "Orçamentos") com
    ResourceList(useResource(comercial.orcamentos)) e o botão "Aprovar" em cada linha em rascunho.

  ## 3. Fluxo de Execução
  1. Persistência SurrealDB — comercial_orcamentos, por organização.
  2. aprovar: lê (resources.get), confere status e papel, atualiza (resources.update).

  ## 4. Casos de Borda e Erros Mapeados
  - ERRO_COMERCIAL_STATUS (409): só orçamento em rascunho é aprovado.
  - ERRO_COMERCIAL_DESCONTO (403): desconto acima de 10% e quem aprova não é owner nem admin.
  - ERRO_RECORD_NOT_FOUND (404): de outra organização ou inexistente.
acceptance: |
  from pathlib import Path

  from core.testing import service_app


  def test_aprovar():
      async def cenario(app):
          dona = app.user("ana", "acme", "owner")
          vendedor = app.user("caio", "acme", "member")
          pequeno = (await vendedor.post("/orcamentos", json={"cliente": "Padaria", "valor": 1000, "desconto": 5})).json()["data"]
          grande = (await vendedor.post("/orcamentos", json={"cliente": "Mercado", "valor": 5000, "desconto": 15})).json()["data"]
          ok = await vendedor.post("/aprovar", json={"id": pequeno["id"]})
          assert ok.status_code == 200, ok.text
          assert ok.json()["data"]["status"] == "aprovado"
          negado = await vendedor.post("/aprovar", json={"id": grande["id"]})
          assert negado.status_code == 403 and negado.json()["error"]["code"] == "ERRO_COMERCIAL_DESCONTO"
          assert (await dona.post("/aprovar", json={"id": grande["id"]})).json()["data"]["status"] == "aprovado"
          de_novo = await dona.post("/aprovar", json={"id": pequeno["id"]})
          assert de_novo.status_code == 409 and de_novo.json()["error"]["code"] == "ERRO_COMERCIAL_STATUS"
          assert (await app.user("bia", "beta", "owner").post("/aprovar", json={"id": pequeno["id"]})).status_code == 404
          assert (await vendedor.post("/orcamentos", json={"cliente": "Ruim", "valor": 10, "desconto": 120})).status_code == 422
          registros = await dona.get("/registros")
          assert registros.status_code == 200  # o esqueleto continua

      service_app(cenario)


  def test_subtela():
      tela = Path("frontend/src/modules/comercial/orcamentos/page.tsx").read_text()
      assert "useResource(comercial.orcamentos)" in tela and "comercial.aprovar" in tela
