  services/svc-comercial/schemas.py: |
    """svc-comercial · contratos (DTOs, enums, constantes). Fonte da verdade: specs/comercial.md §2"""
    from typing import Any, Literal

    from pydantic import BaseModel, ConfigDict, Field

    from core.plans import Module
    from core.resources import Fields, Money, Resource, Text

    # Nomes canônicos gerados pelo service.sh — literais de propósito: um grep acha tudo.
    SERVICE = "svc-comercial"
    TASK_QUEUE = "comercial-queue"
    TRIGGER_SUBJECT = "events.comercial.trigger"
    PROCESSED_SUBJECT = "events.comercial.processed"

    # O serviço como módulo (README §5.17): título e categoria no menu e no plano; limits=[Limit(...)] o que ele limita;
    # requires=("outro",) os módulos sem os quais não funciona; default=False se só entra quando o plano incluir.
    MODULE = Module("Comercial", "Orçamentos e propostas", category="Comercial")


    # Cadastros (README §5.19): lista, criação, edição, remoção, rotas, contrato e tela saem da declaração.
    # Campo novo = uma linha aqui (title= é o rótulo na tela); outro cadastro = outro Resource em RESOURCES.
    class Registro(Fields):
        title: str = Field(..., min_length=1, max_length=200, title="Título", description="Aparece na lista e entra na busca")
        notes: Text | None = Field(None, title="Observações")


    REGISTROS = Resource(SERVICE, "registros", Registro, "Registros", search=("title",), sort=("title",))


    class Orcamento(Fields):
        cliente: str = Field(..., min_length=2, max_length=120, title="Cliente")
        valor: Money = Field(..., gt=0, title="Valor")
        desconto: float = Field(0, ge=0, le=100, title="Desconto (%)")
        status: Literal["rascunho", "aprovado", "recusado"] = Field("rascunho", title="Status")


    ORCAMENTOS = Resource(SERVICE, "orcamentos", Orcamento, "Orçamentos", search=("cliente",), sort=("valor",), filters=("status",))
    RESOURCES = [REGISTROS, ORCAMENTOS]
    OrcamentoItem = ORCAMENTOS.item


    class Aprovacao(BaseModel):
        model_config = ConfigDict(extra="forbid")

        id: str = Field(..., pattern=r"^[A-Za-z0-9_-]{1,64}$")


    class ExecutionInput(BaseModel):
        model_config = ConfigDict(extra="forbid")  # campo não declarado é recusado (mass assignment)

        title: str = Field(..., min_length=1, max_length=200, description="Título do registro que a tarefa cria")
        payload: dict[str, Any] = Field(default_factory=dict, description="Dados da tarefa")


    class ExecutionResult(BaseModel):
        task_id: str
        status: str
        data: dict[str, Any] = Field(default_factory=dict)
  services/svc-comercial/service.py: |
    """svc-comercial · lógica de negócio pura. Fonte da verdade: specs/comercial.md §3

    Trilho (validado no import por @activities): todo método público é async, recebe 1 modelo
    de schemas.py, retorna 1 modelo de schemas.py e vira a activity Temporal "comercial.<método>".
    Helpers começam com _ e nunca viram activities. O cadastro (RESOURCES) não precisa de código aqui: o core faz
    lista, leitura, criação, edição e remoção; aqui fica só a regra de negócio (README §5.19).
    """
    from core.envelope import ServiceError
    from core.nats_bus import bus
    from core.resources import ResourceRef, resources
    from core.security import current
    from core.surreal import Migration
    from core.temporal_runner import activities

    from schemas import ORCAMENTOS, PROCESSED_SUBJECT, REGISTROS, Aprovacao, ExecutionInput, ExecutionResult, OrcamentoItem, Registro

    # Mudanças de dados versionadas, rodadas uma vez por banco no boot (README §5.13). Nunca edite uma já publicada:
    #   Migration(1, "observação padrão nos registros antigos", sql="UPDATE comercial_registros SET notes = '' WHERE notes = NONE")
    MIGRATIONS: list[Migration] = []


    @activities("comercial")
    class ComercialService:
        async def process_task(self, data: ExecutionInput) -> ExecutionResult:
            """Uma ação de negócio (POST /execute, ou durável pelo gatilho NATS): cria um registro no cadastro."""
            item = await resources.create(REGISTROS, Registro(title=data.title))
            result = ExecutionResult(task_id=item.id, status="SUCCESS", data={**item.model_dump(mode="json"), "payload": data.payload})
            await bus.publish(PROCESSED_SUBJECT, result, msg_id=result.task_id)
            return result

        async def aprovar(self, data: Aprovacao) -> OrcamentoItem:
            """Aprova um orçamento em rascunho; desconto acima de 10% só com dono ou administrador."""
            atual = await resources.get(ORCAMENTOS, ResourceRef(id=data.id))
            if atual.status != "rascunho":
                raise ServiceError("ERRO_COMERCIAL_STATUS", "Só orçamento em rascunho pode ser aprovado.", status=409)
            who = current()
            if atual.desconto > 10 and not (who and {"owner", "admin"} & who.roles):
                raise ServiceError("ERRO_COMERCIAL_DESCONTO", "Desconto acima de 10% só com dono ou administrador.", status=403)
            return await resources.update(ORCAMENTOS, ORCAMENTOS.update(id=data.id, status="aprovado"))
  services/svc-comercial/main.py: |
    """svc-comercial · ingress duplo + worker Temporal no mesmo loop. Fonte da verdade: specs/comercial.md

    HTTP /registros...  → cadastro declarado em schemas.RESOURCES (core/resources.py): lista, item, cria, edita, remove.
    HTTP POST /execute  → chamada direta ao service (síncrona). Exige token: nega por padrão.
    NATS TRIGGER_SUBJECT → inicia ComercialWorkflow (assíncrona, durável e idempotente).

    Rodar (da raiz): uv run python -m uvicorn --app-dir services/svc-comercial main:app --port 8100 --env-file .env
    """
    from contextlib import asynccontextmanager

    from fastapi import FastAPI

    from core.envelope import ResponseEnvelope, install_envelope
    from core.nats_bus import bus
    from core.plans import plans
    from core.resources import resources
    from core.security import install_security
    from core.surreal import db
    from core.telemetry import install_telemetry
    from core.temporal_runner import runner

    from schemas import MODULE, RESOURCES, SERVICE, TASK_QUEUE, TRIGGER_SUBJECT, Aprovacao, ExecutionInput
    from service import MIGRATIONS, ComercialService
    from workflows import SCHEDULES, ComercialWorkflow

    svc = ComercialService()


    async def on_trigger(data: ExecutionInput) -> None:
        # id = id estável da mensagem: reentrega do NATS nunca inicia um segundo workflow.
        await runner.start_workflow(ComercialWorkflow.run, data, task_queue=TASK_QUEUE, id=bus.message_id())


    @asynccontextmanager
    async def lifespan(app: FastAPI):
        async with (
            bus.connected(SERVICE),
            db.connected(resources=RESOURCES, migrations=MIGRATIONS, service=SERVICE),
            runner.worker(TASK_QUEUE, workflows=[ComercialWorkflow], service=svc, schedules=SCHEDULES),
        ):
            await bus.subscribe(TRIGGER_SUBJECT, on_trigger, model=ExecutionInput)
            await plans.declare(MODULE)  # módulo no catálogo dos planos; desligado para a organização, o core recusa
            yield


    app = FastAPI(title=SERVICE, lifespan=lifespan)
    install_envelope(app, service=SERVICE)
    install_security(app, service=SERVICE)  # rota pública só se o spec §2 declarar: public=("/rota",)
    install_telemetry(app, service=SERVICE)  # logs, trace, métricas e /health (README §5.18)
    resources.mount(app, RESOURCES)  # as rotas dos cadastros (README §5.19)


    @app.post("/execute", response_model=ResponseEnvelope)
    async def execute(data: ExecutionInput) -> ResponseEnvelope:
        return ResponseEnvelope.success(data=await svc.process_task(data), service=SERVICE)


    @app.post("/aprovar", response_model=ResponseEnvelope)
    async def aprovar(data: Aprovacao) -> ResponseEnvelope:
        return ResponseEnvelope.success(data=await svc.aprovar(data), service=SERVICE)
  gateway/endpoints/comercial.yaml: |
    # svc-comercial · rotas públicas no Gateway. Fonte da verdade: specs/comercial.md §2
    service: comercial
    base_path: /api/v1/comercial

    # Cadastros do schemas.py (core/resources.py, README §5.19): cada um publica 5 rotas e o aviso ao vivo
    # comercial.<cadastro>, e vira comercial.<cadastro> no frontend.
    resources: [registros, orcamentos]

    endpoints:
      - path: /execute
        method: POST
        auth: client_jwt
        request: ExecutionInput        # modelos de schemas.py: viram os tipos do frontend (gateway/contracts.py)
        response: ExecutionResult
        target_type: http
        target_url: http://svc-comercial:8000/execute
        timeout: 30

      - path: /trigger
        method: POST
        auth: client_jwt
        request: ExecutionInput
        target_type: nats
        nats_subject: events.comercial.trigger

      - path: /aprovar
        method: POST
        auth: client_jwt
        request: Aprovacao
        response: OrcamentoItem
        target_type: http
        target_url: http://svc-comercial:8000/aprovar
  frontend/src/modules/comercial/orcamentos/page.tsx: |
    import type { PageMeta } from "@/App";
    import { Button } from "@/components/Button";
    import { Page } from "@/components/Page";
    import { ResourceList } from "@/components/ResourceList";
    import { useAction, useResource } from "@/core/api";
    import { comercial } from "@/core/contracts";

    export const meta: PageMeta = { title: "Orçamentos" };

    export default function Orcamentos() {
      const orcamentos = useResource(comercial.orcamentos);
      const aprovar = useAction(comercial.aprovar, { onSuccess: orcamentos.list.reload });
      return (
        <Page title="Orçamentos" description="Orçamentos da equipe; desconto acima de 10% só o dono ou um administrador aprova.">
          <ResourceList
            resource={orcamentos}
            noun="orçamento"
            rowActions={(o) =>
              o.status === "rascunho" && (
                <Button size="sm" variant="secondary" loading={aprovar.running} onClick={() => void aprovar.run({ id: o.id })}>
                  Aprovar
                </Button>
              )
            }
          />
        </Page>
      );
    }
