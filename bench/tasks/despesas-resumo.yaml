    import type { PageMeta } from "@/App";
    import { Page } from "@/components/Page";
    import { ResourceList } from "@/components/ResourceList";
    import { useResource } from "@/core/api";
    import { despesas } from "@/core/contracts";

    export const meta: PageMeta = { title: "Despesas", module: "despesas" };

    export default function Despesas() {
      const lista = useResource(despesas.despesas);
      return (
        <Page title="Despesas" description="Gastos da organização.">
          <ResourceList resource={lista} noun="despesa" />
        </Page>
      );
    }
