# Nível 2: consulta agregada em SurrealQL, sempre na organização ($tenant).
id: despesas-resumo
level: 2
service: despesas
title: Despesas com resumo do mês
spec: |
  # Spec: despesas

  ## 1. Objetivo Operacional
  Despesas da organização e o resumo do mês por categoria.
  Módulo (schemas.MODULE): título "Despesas", descrição "Gastos e resumo mensal", categoria "Financeiro".

  ## 2. Contrato de Entrada e Saída
  - Cadastro `despesas` (Resource, título "Despesas"), modelo `Despesa`:
    - `descricao`: texto obrigatório, 2 a 160 caracteres, título "Descrição";
    - `categoria`: "aluguel" | "pessoal" | "insumos" | "outros", título "Categoria" (obrigatória);
    - `valor`: Money com gt=0, título "Valor";
    - `data`: data (date) obrigatória, título "Data".
  - Busca em descricao; filtro por categoria; ordem por data e valor.
  - GET /resumo?mes=AAAA-MM (`ResumoQuery { mes }`, mes com o padrão ^\d{4}-\d{2}$) → `Resumo { mes, total,
    por_categoria: dict[str, float] }`: soma das despesas cuja data está no mês (categorias sem despesa ficam fora).
    Rota no manifesto (GET, query: ResumoQuery, response: Resumo) e no main.py; a consulta em service.py, com
    db.query e WHERE tenant = $tenant (a data é guardada como texto AAAA-MM-DD: string::starts_with(data, $mes)).
  - Mantenha o restante do esqueleto (registros, /execute, gatilho e workflow).
  - Tela do módulo: as despesas com ResourceList.

  ## 3. Fluxo de Execução
  1. Persistência SurrealDB — despesas_despesas, por organização.

  ## 4. Casos de Borda e Erros Mapeados
  - 422: mes fora do padrão AAAA-MM.
acceptance: |
  from core.testing import service_app


  def test_resumo_do_mes():
      async def cenario(app):
          ana = app.user("ana", "acme", "owner")
          for descricao, categoria, valor, data in (("Aluguel loja", "aluguel", 3000, "2026-10-05"),
                                                    ("Farinha", "insumos", 450.5, "2026-10-08"),
                                                    ("Açúcar", "insumos", 120, "2026-10-20"),
                                                    ("Aluguel setembro", "aluguel", 3000, "2026-09-05")):
              r = await ana.post("/despesas", json={"descricao": descricao, "categoria": categoria, "valor": valor, "data": data})
              assert r.status_code == 200, r.text
          await app.user("bia", "beta", "owner").post("/despesas", json={"descricao": "Da Beta", "categoria": "outros", "valor": 999, "data": "2026-10-01"})
          resumo = await ana.get("/resumo", params={"mes": "2026-10"})
          assert resumo.status_code == 200, resumo.text
          dados = resumo.json()["data"]
          assert dados["mes"] == "2026-10" and abs(dados["total"] - 3570.5) < 0.001
          assert {k: round(v, 2) for k, v in dados["por_categoria"].items()} == {"aluguel": 3000, "insumos": 570.5}
          vazio = (await ana.get("/resumo", params={"mes": "2025-01"})).json()["data"]
          assert (vazio["total"], vazio["por_categoria"]) == (0, {})
          assert (await ana.get("/resumo", params={"mes": "outubro"})).status_code == 422
          assert (await ana.post("/despesas", json={"descricao": "Sem categoria", "valor": 1, "data": "2026-10-01"})).status_code == 422

      service_app(cenario)
