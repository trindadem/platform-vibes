# Nível 2: ação que cria pelo cadastro e avisa pessoas (core/notify.py).
# O serviço é o "suporte": o svc-atendimento de verdade é o "Falar com a Cogniventure" (O1).
id: atendimento-chamados
level: 2
service: suporte
title: Chamados com aviso de urgência
spec: |
  # Spec: suporte

  ## 1. Objetivo Operacional
  Chamados de atendimento; chamado de prioridade alta avisa donos e administradores na hora.
  Módulo (schemas.MODULE): título "Atendimento", descrição "Chamados e solicitações", categoria "Serviços".

  ## 2. Contrato de Entrada e Saída
  - Cadastro `chamados` (Resource, título "Chamados"), modelo `Chamado`:
    - `assunto`: texto obrigatório, 3 a 120 caracteres, título "Assunto";
    - `descricao`: Text opcional, título "Descrição";
    - `prioridade`: "baixa" | "media" | "alta", padrão "media", título "Prioridade";
    - `status`: "aberto" | "fechado", padrão "aberto", título "Status".
  - Busca em assunto; filtros por prioridade e status.
  - POST /abrir (`Chamado`) → `ChamadoItem`: cria pelo cadastro (resources.create) e, se a prioridade for "alta",
    avisa com notify.roles("owner", "admin", title="Chamado urgente: <assunto>", body=<descricao ou "">,
    link="/suporte", key="chamado-<id>"). A rota POST /chamados do cadastro também existe e não avisa.
  - Mantenha o restante do esqueleto (registros, /execute, gatilho e workflow).
  - Tela do módulo: os chamados com ResourceList.

  ## 3. Fluxo de Execução
  1. Persistência SurrealDB — suporte_chamados, por organização.
  2. Aviso pelo core/notify.py (events.notify.send), só para prioridade alta.

  ## 4. Casos de Borda e Erros Mapeados
  - 422: assunto curto ou prioridade fora da lista.
acceptance: |
  from core.notify import SEND_SUBJECT
  from core.testing import service_app


  def test_abrir_avisa_so_o_urgente():
      async def cenario(app):
          ana = app.user("ana", "acme", "member")
          normal = await ana.post("/abrir", json={"assunto": "Dúvida sobre nota"})
          assert normal.status_code == 200, normal.text
          urgente = await ana.post("/abrir", json={"assunto": "Sistema parado", "descricao": "Caixa não abre", "prioridade": "alta"})
          assert urgente.status_code == 200, urgente.text
          avisos = [m for s, m in app.published if s == SEND_SUBJECT]
          assert len(avisos) == 1
          aviso = avisos[0]
          assert (aviso.title, aviso.body, aviso.link, sorted(aviso.roles)) == ("Chamado urgente: Sistema parado", "Caixa não abre", "/suporte", ["admin", "owner"])
          pelo_cadastro = await ana.post("/chamados", json={"assunto": "Outro urgente", "prioridade": "alta"})
          assert pelo_cadastro.status_code == 200
          assert len([1 for s, _ in app.published if s == SEND_SUBJECT]) == 1  # o cadastro não avisa
          altas = await ana.get("/chamados", params={"prioridade": "alta"})
          assert altas.json()["data"]["total"] == 2
          assert (await ana.post("/abrir", json={"assunto": "Oi"})).status_code == 422

      service_app(cenario)
