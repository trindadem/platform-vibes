    import type { PageMeta } from "@/App";
    import { Page } from "@/components/Page";
    import { ResourceList } from "@/components/ResourceList";
    import { useResource } from "@/core/api";
    import { suporte } from "@/core/contracts";

    export const meta: PageMeta = { title: "Atendimento", module: "suporte" };

    export default function Suporte() {
      const chamados = useResource(suporte.chamados);
      return (
        <Page title="Chamados" description="Chamados e solicitações; prioridade alta avisa os responsáveis.">
          <ResourceList resource={chamados} noun="chamado" />
        </Page>
      );
    }
