# Nível 1: só declaração. Um cadastro novo no módulo, sem regra de negócio.
id: crm-contatos
level: 1
service: crm
title: Cadastro de contatos (só declaração)
spec: |
  # Spec: crm

  ## 1. Objetivo Operacional
  Guardar os contatos comerciais da organização (clientes, fornecedores e parceiros) com busca e filtro por tipo.
  Módulo (schemas.MODULE): título "CRM", descrição "Contatos e relacionamento", categoria "Comercial".

  ## 2. Contrato de Entrada e Saída
  - Cadastro `contatos` (Resource em schemas.RESOURCES, título "Contatos"), campos do modelo `Contato`:
    - `nome`: texto obrigatório, de 2 a 120 caracteres, título "Nome";
    - `email`: Email opcional, título "E-mail";
    - `telefone`: Phone opcional, título "Telefone";
    - `empresa`: texto opcional, até 120 caracteres, título "Empresa";
    - `tipo`: "cliente" | "fornecedor" | "parceiro", padrão "cliente", título "Tipo".
  - Busca por palavras em nome, email e empresa; filtro por tipo; ordem por nome.
  - O cadastro `registros` do esqueleto continua como está.
  - Tela do módulo (frontend/src/modules/crm/page.tsx): a lista de contatos com ResourceList (useResource(crm.contatos)).

  ## 3. Fluxo de Execução
  1. Persistência SurrealDB — cadastro por organização: crm_contatos (o core grava, filtra e carimba).

  ## 4. Casos de Borda e Erros Mapeados
  - 422: nome curto, e-mail inválido ou tipo fora da lista.
  - ERRO_RECORD_NOT_FOUND (404): contato de outra organização.
acceptance: |
  from pathlib import Path

  import schemas
  from core.testing import service_app


  def test_modulo_declarado():
      assert (schemas.MODULE.title, schemas.MODULE.category) == ("CRM", "Comercial")
      nomes = [r.name for r in schemas.RESOURCES]
      assert "contatos" in nomes and "registros" in nomes


  def test_contatos_pelas_rotas():
      async def cenario(app):
          ana = app.user("ana", "acme", "owner")
          maria = await ana.post("/contatos", json={"nome": "Maria Souza", "email": "Maria@Exemplo.com", "empresa": "Padaria Aurora", "tipo": "fornecedor"})
          assert maria.status_code == 200, maria.text
          assert maria.json()["data"]["email"] == "maria@exemplo.com"
          joao = await ana.post("/contatos", json={"nome": "João Lima", "telefone": "+55 11 99999-0000"})
          assert joao.status_code == 200, joao.text
          assert joao.json()["data"]["tipo"] == "cliente"
          for ruim in ({"nome": "X"}, {"nome": "Ana Paula", "tipo": "outro"}, {"nome": "Ana Paula", "email": "sem-arroba"}):
              assert (await ana.post("/contatos", json=ruim)).status_code == 422, ruim
          busca = await ana.get("/contatos", params={"q": "aurora"})
          assert [c["nome"] for c in busca.json()["data"]["items"]] == ["Maria Souza"]
          clientes = await ana.get("/contatos", params={"tipo": "cliente"})
          assert [c["nome"] for c in clientes.json()["data"]["items"]] == ["João Lima"]
          ordem = await ana.get("/contatos", params={"sort": "nome"})
          assert [c["nome"] for c in ordem.json()["data"]["items"]] == ["João Lima", "Maria Souza"]
          beta = app.user("bia", "beta", "owner")
          assert (await beta.get("/contatos")).json()["data"]["total"] == 0
          assert (await beta.get("/contatos/item", params={"id": maria.json()["data"]["id"]})).status_code == 404

      service_app(cenario)


  def test_tela_usa_o_cadastro():
      tela = Path("frontend/src/modules/crm/page.tsx").read_text()
      assert "useResource(crm.contatos)" in tela and "<ResourceList" in tela
