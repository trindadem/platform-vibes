reference:
  services/svc-crm/schemas.py: |
    """svc-crm · contratos (DTOs, enums, constantes). Fonte da verdade: specs/crm.md §2"""
    from typing import Any, Literal

    from pydantic import BaseModel, ConfigDict, Field

    from core.plans import Module
    from core.resources import Email, Fields, Phone, Resource, Text

    # Nomes canônicos gerados pelo service.sh — literais de propósito: um grep acha tudo.
    SERVICE = "svc-crm"
    TASK_QUEUE = "crm-queue"
    TRIGGER_SUBJECT = "events.crm.trigger"
    PROCESSED_SUBJECT = "events.crm.processed"

    # O serviço como módulo (README §5.17): título e categoria no menu e no plano; limits=[Limit(...)] o que ele limita;
    # requires=("outro",) os módulos sem os quais não funciona; default=False se só entra quando o plano incluir.
    MODULE = Module("CRM", "Contatos e relacionamento", category="Comercial")


    # Cadastros (README §5.19): lista, criação, edição, remoção, rotas, contrato e tela saem da declaração.
    # Campo novo = uma linha aqui (title= é o rótulo na tela); outro cadastro = outro Resource em RESOURCES.
    class Registro(Fields):
        title: str = Field(..., min_length=1, max_length=200, title="Título", description="Aparece na lista e entra na busca")
        notes: Text | None = Field(None, title="Observações")


    REGISTROS = Resource(SERVICE, "registros", Registro, "Registros", search=("title",), sort=("title",))


    class Contato(Fields):
        nome: str = Field(..., min_length=2, max_length=120, title="Nome")
        email: Email | None = Field(None, title="E-mail")
        telefone: Phone | None = Field(None, title="Telefone")
        empresa: str | None = Field(None, max_length=120, title="Empresa")
        tipo: Literal["cliente", "fornecedor", "parceiro"] = Field("cliente", title="Tipo")


    CONTATOS = Resource(SERVICE, "contatos", Contato, "Contatos", search=("nome", "email", "empresa"), sort=("nome",), filters=("tipo",))
    RESOURCES = [REGISTROS, CONTATOS]


    class ExecutionInput(BaseModel):
        model_config = ConfigDict(extra="forbid")  # campo não declarado é recusado (mass assignment)

        title: str = Field(..., min_length=1, max_length=200, description="Título do registro que a tarefa cria")
        payload: dict[str, Any] = Field(default_factory=dict, description="Dados da tarefa")


    class ExecutionResult(BaseModel):
        task_id: str
        status: str
        data: dict[str, Any] = Field(default_factory=dict)
  gateway/endpoints/crm.yaml: |
    # svc-crm · rotas públicas no Gateway. Fonte da verdade: specs/crm.md §2
    service: crm
    base_path: /api/v1/crm

    # Cadastros do schemas.py (core/resources.py, README §5.19): cada um publica 5 rotas e o aviso ao vivo
    # crm.<cadastro>, e vira crm.<cadastro> no frontend.
    resources: [registros, contatos]

    endpoints:
      - path: /execute
        method: POST
        auth: client_jwt
        request: ExecutionInput        # modelos de schemas.py: viram os tipos do frontend (gateway/contracts.py)
        response: ExecutionResult
        target_type: http
        target_url: http://svc-crm:8000/execute
        timeout: 30

      - path: /trigger
        method: POST
        auth: client_jwt
        request: ExecutionInput
        target_type: nats
        nats_subject: events.crm.trigger
  frontend/src/modules/crm/page.tsx: |
    import type { PageMeta } from "@/App";
    import { Page } from "@/components/Page";
    import { ResourceList } from "@/components/ResourceList";
    import { useResource } from "@/core/api";
    import { crm } from "@/core/contracts";

    export const meta: PageMeta = { title: "CRM", module: "crm" };

    export default function Crm() {
      const contatos = useResource(crm.contatos);
      return (
        <Page title="Contatos" description="Clientes, fornecedores e parceiros da organização.">
          <ResourceList resource={contatos} noun="contato" />
        </Page>
      );
    }
