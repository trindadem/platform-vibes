# Nível 1: declaração com índice único, limite do plano e filtros.
id: estoque-produtos
level: 1
service: estoque
title: Produtos com SKU único e limite do plano
spec: |
  # Spec: estoque

  ## 1. Objetivo Operacional
  Cadastro de produtos da organização com código (SKU) único, preço e quantidade em estoque, limitado pelo plano.
  Módulo (schemas.MODULE): título "Estoque", descrição "Produtos e quantidades", categoria "Operações", com o limite
  total `produtos` ("Produtos cadastrados", default 500, unidade "produtos").

  ## 2. Contrato de Entrada e Saída
  - Cadastro `produtos` (Resource, título "Produtos"), modelo `Produto`:
    - `nome`: texto obrigatório, 2 a 120 caracteres, título "Nome";
    - `sku`: texto obrigatório, padrão ^[A-Z0-9-]{3,20}$, título "SKU", único na organização;
    - `preco`: Money, padrão 0, título "Preço";
    - `quantidade`: inteiro >= 0, padrão 0, título "Quantidade";
    - `ativo`: bool, padrão true, título "Ativo".
  - Busca em nome e sku; filtro por ativo; ordem por nome, preco e quantidade; limite do plano `produtos` no cadastro.
  - Substitua o cadastro `registros` do esqueleto por `produtos`. A ação /execute e o gatilho continuam, mas passam a
    criar um produto com nome = title e sku "AUTO-001". A tela do módulo mostra os produtos com ResourceList.

  ## 3. Fluxo de Execução
  1. Persistência SurrealDB — estoque_produtos, por organização, com índice único em sku.

  ## 4. Casos de Borda e Erros Mapeados
  - ERRO_RECORD_DUPLICATE (409): SKU repetido na organização (em outra organização pode repetir).
  - ERRO_PLAN_LIMIT (402): a organização chegou ao limite de produtos do plano.
  - 422: SKU fora do padrão ou quantidade negativa.
acceptance: |
  import schemas
  from core.plans import LIMITS_SUBJECT, LimitState, PlanLimits
  from core.security import current_tenant
  from core.testing import service_app


  def test_modulo_e_limite():
      assert (schemas.MODULE.title, schemas.MODULE.category) == ("Estoque", "Operações")
      limite = {l.name: l for l in schemas.MODULE.limits}["produtos"]
      assert (limite.default, limite.monthly) == (500, False)
      assert [r.name for r in schemas.RESOURCES] == ["produtos"]


  def test_produtos_pelas_rotas():
      async def cenario(app):
          ana = app.user("ana", "acme", "owner")
          ok = await ana.post("/produtos", json={"nome": "Pão francês", "sku": "PAO-01", "preco": 0.8, "quantidade": 100})
          assert ok.status_code == 200, ok.text
          assert ok.json()["data"]["ativo"] is True
          assert (await ana.post("/produtos", json={"nome": "Outro pão", "sku": "PAO-01"})).status_code == 409
          assert (await app.user("bia", "beta", "owner").post("/produtos", json={"nome": "Pão", "sku": "PAO-01"})).status_code == 200
          for ruim in ({"nome": "Bolo", "sku": "bolo"}, {"nome": "Bolo", "sku": "BOLO-1", "quantidade": -1}):
              assert (await ana.post("/produtos", json=ruim)).status_code == 422, ruim
          await ana.post("/produtos", json={"nome": "Bolo de milho", "sku": "BOLO-1", "preco": 25, "ativo": False})
          inativos = await ana.get("/produtos", params={"ativo": "false"})
          assert [p["nome"] for p in inativos.json()["data"]["items"]] == ["Bolo de milho"]
          caros = await ana.get("/produtos", params={"sort": "-preco"})
          assert [p["sku"] for p in caros.json()["data"]["items"]] == ["BOLO-1", "PAO-01"]
          busca = await ana.get("/produtos", params={"q": "bolo"})
          assert busca.json()["data"]["total"] == 1
          app.respond(LIMITS_SUBJECT, lambda _: PlanLimits(plan="basico", plan_name="Básico", month="2026-10", limits=[
              LimitState(name="estoque.produtos", service="svc-estoque", description="Produtos cadastrados", default=500,
                         monthly=False, unit="produtos", limit=2 if current_tenant() == "acme" else None, used=0)]))
          from core.plans import plans
          plans.clear()
          cheio = await ana.post("/produtos", json={"nome": "Café", "sku": "CAFE-1"})
          assert cheio.status_code == 402 and cheio.json()["error"]["code"] == "ERRO_PLAN_LIMIT"

      service_app(cenario)
