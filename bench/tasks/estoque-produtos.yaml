    import type { PageMeta } from "@/App";
    import { Page } from "@/components/Page";
    import { ResourceList } from "@/components/ResourceList";
    import { useResource } from "@/core/api";
    import { estoque } from "@/core/contracts";

    export const meta: PageMeta = { title: "Estoque", module: "estoque" };

    export default function Estoque() {
      const produtos = useResource(estoque.produtos);
      return (
        <Page title="Produtos" description="Produtos e quantidades em estoque.">
          <ResourceList resource={produtos} noun="produto" />
        </Page>
      );
    }
