  services/svc-financeiro/schemas.py: |
    """svc-financeiro · contratos (DTOs, enums, constantes). Fonte da verdade: specs/financeiro.md §2"""
    from datetime import date
    from typing import Literal

    from pydantic import BaseModel, ConfigDict, Field

    from core.plans import Module
    from core.resources import Fields, Money, Resource

    # Nomes canônicos gerados pelo service.sh — literais de propósito: um grep acha tudo.
    SERVICE = "svc-financeiro"
    TASK_QUEUE = "financeiro-queue"

    MODULE = Module("Financeiro", "Contas a receber", category="Financeiro")


    class Recebivel(Fields):
        descricao: str = Field(..., min_length=2, max_length=160, title="Descrição")
        cliente: str = Field(..., min_length=2, max_length=120, title="Cliente")
        valor: Money = Field(..., gt=0, title="Valor")
        vencimento: date = Field(..., title="Vencimento")
        status: Literal["aberto", "pago", "cancelado"] = Field("aberto", title="Status")
        pago_em: date | None = Field(None, title="Pago em")


    RECEBIVEIS = Resource(
        SERVICE, "recebiveis", Recebivel, "Contas a receber", search=("descricao", "cliente"), sort=("vencimento", "valor"),
        filters=("status",),
    )
    RESOURCES = [RECEBIVEIS]
    RecebivelItem = RECEBIVEIS.item


    class Pagamento(BaseModel):
        model_config = ConfigDict(extra="forbid")

        id: str = Field(..., pattern=r"^[A-Za-z0-9_-]{1,64}$")
        pago_em: date | None = None
  services/svc-financeiro/service.py: |
    """svc-financeiro · lógica de negócio pura. Fonte da verdade: specs/financeiro.md §3"""
    from datetime import UTC, datetime

    from core.envelope import ServiceError
    from core.resources import ResourceRef, resources
    from core.surreal import Migration
    from core.temporal_runner import activities

    from schemas import RECEBIVEIS, Pagamento, RecebivelItem

    MIGRATIONS: list[Migration] = []


    @activities("financeiro")
    class FinanceiroService:
        async def pagar(self, data: Pagamento) -> RecebivelItem:
            """Dá baixa: status pago e a data do pagamento (a informada ou hoje, em UTC)."""
            atual = await resources.get(RECEBIVEIS, ResourceRef(id=data.id))
            if atual.status == "pago":
                raise ServiceError("ERRO_FINANCEIRO_JA_PAGO", "Este recebível já está pago.", status=409)
            if atual.status == "cancelado":
                raise ServiceError("ERRO_FINANCEIRO_CANCELADO", "Recebível cancelado não recebe pagamento.", status=409)
            pago_em = data.pago_em or datetime.now(UTC).date()
            return await resources.update(RECEBIVEIS, RECEBIVEIS.update(id=data.id, status="pago", pago_em=pago_em))
