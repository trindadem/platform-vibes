  frontend/src/modules/financeiro/page.tsx: |
    import type { PageMeta } from "@/App";
    import { Button } from "@/components/Button";
    import { Page } from "@/components/Page";
    import { ResourceList } from "@/components/ResourceList";
    import { useAction, useResource } from "@/core/api";
    import { financeiro } from "@/core/contracts";

    export const meta: PageMeta = { title: "Financeiro", module: "financeiro" };

    export default function Financeiro() {
      const recebiveis = useResource(financeiro.recebiveis);
      const receber = useAction(financeiro.pagar, { onSuccess: recebiveis.list.reload });
      return (
        <Page title="Contas a receber" description="Cadastre, acompanhe e dê baixa nos pagamentos.">
          <ResourceList
            resource={recebiveis}
            noun="recebível"
            rowActions={(r) =>
              r.status === "aberto" && (
                <Button size="sm" variant="secondary" loading={receber.running} onClick={() => void receber.run({ id: r.id })}>
                  Receber
                </Button>
              )
            }
          />
        </Page>
      );
    }
