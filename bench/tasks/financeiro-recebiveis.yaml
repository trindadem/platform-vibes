  services/svc-financeiro/main.py: |
    """svc-financeiro · ingress duplo + worker Temporal no mesmo loop. Fonte da verdade: specs/financeiro.md

    HTTP /recebiveis... → cadastro declarado em schemas.RESOURCES (core/resources.py).
    HTTP POST /pagar    → dá baixa num recebível.

    Rodar (da raiz): uv run python -m uvicorn --app-dir services/svc-financeiro main:app --port 8100 --env-file .env
    """
    from contextlib import asynccontextmanager

    from fastapi import FastAPI

    from core.envelope import ResponseEnvelope, install_envelope
    from core.nats_bus import bus
    from core.plans import plans
    from core.resources import resources
    from core.security import install_security
    from core.surreal import db
    from core.telemetry import install_telemetry
    from core.temporal_runner import runner

    from schemas import MODULE, RESOURCES, SERVICE, TASK_QUEUE, Pagamento
    from service import MIGRATIONS, FinanceiroService
    from workflows import SCHEDULES

    svc = FinanceiroService()


    @asynccontextmanager
    async def lifespan(app: FastAPI):
        async with (
            bus.connected(SERVICE),
            db.connected(resources=RESOURCES, migrations=MIGRATIONS, service=SERVICE),
            runner.worker(TASK_QUEUE, workflows=[], service=svc, schedules=SCHEDULES),
        ):
            await plans.declare(MODULE)
            yield


    app = FastAPI(title=SERVICE, lifespan=lifespan)
    install_envelope(app, service=SERVICE)
    install_security(app, service=SERVICE)
    install_telemetry(app, service=SERVICE)
    resources.mount(app, RESOURCES)


    @app.post("/pagar", response_model=ResponseEnvelope)
    async def pagar(data: Pagamento) -> ResponseEnvelope:
        return ResponseEnvelope.success(data=await svc.pagar(data), service=SERVICE)
