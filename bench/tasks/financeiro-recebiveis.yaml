# Nível 2: cadastro + uma ação de negócio com regra de estado.
id: financeiro-recebiveis
level: 2
service: financeiro
title: Contas a receber com a ação pagar
spec: |
  # Spec: financeiro

  ## 1. Objetivo Operacional
  Contas a receber da organização: cadastrar, acompanhar e dar baixa no pagamento.
  Módulo (schemas.MODULE): título "Financeiro", descrição "Contas a receber", categoria "Financeiro".

  ## 2. Contrato de Entrada e Saída
  - Cadastro `recebiveis` (Resource, título "Contas a receber"), modelo `Recebivel`:
    - `descricao`: texto obrigatório, 2 a 160 caracteres, título "Descrição";
    - `cliente`: texto obrigatório, 2 a 120 caracteres, título "Cliente";
    - `valor`: número > 0 (Money com gt=0), título "Valor";
    - `vencimento`: data (date) obrigatória, título "Vencimento";
    - `status`: "aberto" | "pago" | "cancelado", padrão "aberto", título "Status";
    - `pago_em`: data (date) opcional, título "Pago em".
  - Busca em descricao e cliente; filtro por status; ordem por vencimento e valor.
  - POST /pagar (`Pagamento { id, pago_em?: date }`) → o `RecebivelItem` atualizado: status "pago" e pago_em (a data
    informada ou a de hoje, em UTC). Rota no manifesto (name: pagar) e no main.py; a regra fica em service.py.
  - Substitua o cadastro `registros` do esqueleto por `recebiveis` e remova a ação /execute, o gatilho /trigger e o
    workflow do esqueleto (o workflows.py fica com SCHEDULES vazio e sem workflow; o main.py sem worker de workflow
    nenhum: runner.worker(TASK_QUEUE, workflows=[], service=svc, schedules=SCHEDULES)).
  - Tela do módulo: os recebíveis com ResourceList e, em cada linha aberta, o botão "Receber" que chama pagar.

  ## 3. Fluxo de Execução
  1. Persistência SurrealDB — financeiro_recebiveis, por organização.
  2. pagar: lê o recebível (resources.get), confere o status e atualiza (resources.update).

  ## 4. Casos de Borda e Erros Mapeados
  - ERRO_RECORD_NOT_FOUND (404): recebível inexistente ou de outra organização.
  - ERRO_FINANCEIRO_JA_PAGO (409): o recebível já está pago.
  - ERRO_FINANCEIRO_CANCELADO (409): recebível cancelado não recebe pagamento.
  - 422: valor zero ou negativo.
acceptance: |
  from datetime import UTC, datetime

  from core.testing import service_app


  def test_pagar():
      async def cenario(app):
          ana = app.user("ana", "acme", "owner")
          criado = await ana.post("/recebiveis", json={"descricao": "Mensalidade outubro", "cliente": "Padaria Aurora", "valor": 750, "vencimento": "2026-10-10"})
          assert criado.status_code == 200, criado.text
          rid = criado.json()["data"]["id"]
          assert criado.json()["data"]["status"] == "aberto"
          assert (await ana.post("/recebiveis", json={"descricao": "Zero", "cliente": "Ninguém", "valor": 0, "vencimento": "2026-10-10"})).status_code == 422
          pago = await ana.post("/pagar", json={"id": rid, "pago_em": "2026-10-09"})
          assert pago.status_code == 200, pago.text
          assert (pago.json()["data"]["status"], pago.json()["data"]["pago_em"]) == ("pago", "2026-10-09")
          de_novo = await ana.post("/pagar", json={"id": rid})
          assert de_novo.status_code == 409 and de_novo.json()["error"]["code"] == "ERRO_FINANCEIRO_JA_PAGO"
          outro = await ana.post("/recebiveis", json={"descricao": "Avulso", "cliente": "Mercado", "valor": 50, "vencimento": "2026-11-01"})
          oid = outro.json()["data"]["id"]
          hoje = await ana.post("/pagar", json={"id": oid})
          assert hoje.json()["data"]["pago_em"] == datetime.now(UTC).date().isoformat()
          cancelado = await ana.post("/recebiveis", json={"descricao": "Cancelado", "cliente": "X Ltda", "valor": 10, "vencimento": "2026-11-01", "status": "cancelado"})
          negado = await ana.post("/pagar", json={"id": cancelado.json()["data"]["id"]})
          assert negado.status_code == 409 and negado.json()["error"]["code"] == "ERRO_FINANCEIRO_CANCELADO"
          assert (await app.user("bia", "beta", "owner").post("/pagar", json={"id": rid})).status_code == 404
          assert (await ana.post("/pagar", json={"id": rid, "extra": 1})).status_code == 422
          pagos = await ana.get("/recebiveis", params={"status": "pago", "sort": "valor"})
          assert [r["valor"] for r in pagos.json()["data"]["items"]] == [50, 750]

      service_app(cenario)


  def test_sem_workflow_do_esqueleto():
      import workflows

      assert workflows.SCHEDULES == []
      assert not [name for name in dir(workflows) if name.endswith("Workflow")]
