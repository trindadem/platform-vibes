# Nível 1: declaração com papéis de escrita, datas e texto longo.
id: projetos-tarefas
level: 1
service: projetos
title: Tarefas com papéis de escrita
spec: |
  # Spec: projetos

  ## 1. Objetivo Operacional
  Quadro de tarefas da organização: todos veem, só donos e administradores criam, editam e removem.
  Módulo (schemas.MODULE): título "Projetos", descrição "Tarefas e prazos", categoria "Operações".

  ## 2. Contrato de Entrada e Saída
  - Cadastro `tarefas` (Resource, título "Tarefas"), modelo `Tarefa`:
    - `titulo`: texto obrigatório, 3 a 160 caracteres, título "Título";
    - `descricao`: Text opcional, título "Descrição";
    - `status`: "a_fazer" | "fazendo" | "feito", padrão "a_fazer", título "Status";
    - `prazo`: data (date) opcional, título "Prazo";
    - `responsavel`: texto opcional, até 120 caracteres, título "Responsável".
  - Busca em titulo e responsavel; filtro por status; ordem por prazo e titulo; escrita só para owner e admin.
  - Substitua o cadastro `registros` do esqueleto por `tarefas`; a ação /execute e o gatilho passam a criar uma tarefa
    com titulo = title. A tela do módulo mostra as tarefas com ResourceList.

  ## 3. Fluxo de Execução
  1. Persistência SurrealDB — projetos_tarefas, por organização.

  ## 4. Casos de Borda e Erros Mapeados
  - ERRO_PROJETOS_FORBIDDEN (403): membro comum tentando criar, editar ou remover.
acceptance: |
  import schemas
  from core.testing import service_app


  def test_tarefas_pelas_rotas():
      async def cenario(app):
          dona = app.user("ana", "acme", "owner")
          membro = app.user("caio", "acme", "member")
          criada = await dona.post("/tarefas", json={"titulo": "Fechar o mês", "prazo": "2026-10-31", "responsavel": "Caio"})
          assert criada.status_code == 200, criada.text
          tarefa = criada.json()["data"]
          assert (tarefa["status"], tarefa["prazo"]) == ("a_fazer", "2026-10-31")
          negado = await membro.post("/tarefas", json={"titulo": "Pelo membro"})
          assert negado.status_code == 403 and negado.json()["error"]["code"] == "ERRO_PROJETOS_FORBIDDEN"
          assert (await membro.post("/tarefas/update", json={"id": tarefa["id"], "status": "feito"})).status_code == 403
          assert (await membro.get("/tarefas")).json()["data"]["total"] == 1  # ler, pode
          await dona.post("/tarefas", json={"titulo": "Abrir o caixa", "prazo": "2026-10-02", "status": "fazendo"})
          ordem = await dona.get("/tarefas", params={"sort": "prazo"})
          assert [t["titulo"] for t in ordem.json()["data"]["items"]] == ["Abrir o caixa", "Fechar o mês"]
          fazendo = await dona.get("/tarefas", params={"status": "fazendo"})
          assert [t["titulo"] for t in fazendo.json()["data"]["items"]] == ["Abrir o caixa"]
          busca = await dona.get("/tarefas", params={"q": "caio"})
          assert [t["titulo"] for t in busca.json()["data"]["items"]] == ["Fechar o mês"]
          assert (await dona.post("/tarefas", json={"titulo": "Ok"})).status_code == 422
          feita = await dona.post("/tarefas/update", json={"id": tarefa["id"], "status": "feito"})
          assert feita.json()["data"]["status"] == "feito"

      service_app(cenario)
