# Ambiente local completo (README §7). Antes, uma vez: uv run python -m core.security keygen (cria o .env).
#   docker compose up --build -d   → API em http://localhost:8088/api/v1/..., Temporal UI em http://localhost:8233,
#                                    Grafana (traces, métricas e logs) em http://localhost:3000
# Toda porta é publicada só em 127.0.0.1: nada fica exposto na rede.
# Produção (README §9): o mesmo arquivo, com o .env de produção e a sobreposição compose.prod.yaml. Por isso as diferenças
# de ambiente entram aqui como variáveis com o padrão local: todo serviço, inclusive os que o service.sh acrescentar, as recebe.
# O service.sh acrescenta cada serviço no FIM deste arquivo: mantenha "services:" como a última seção.
name: cv-frame

x-auth-env: &auth-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  AUTH_ISSUER: ${AUTH_ISSUER:?rode uv run python -m core.security keygen}
  AUTH_AUDIENCE: ${AUTH_AUDIENCE:?rode uv run python -m core.security keygen}
  AUTH_PUBLIC_KEY: ${AUTH_PUBLIC_KEY:?rode uv run python -m core.security keygen}
  NATS_URL: nats://nats:4222

# Observabilidade (README §5.18): traces, métricas e logs por OTLP para o Grafana local (serviço otel). Definida e vazia
# no .env (produção sem backend), nada é exportado.
x-telemetry-env: &telemetry-env
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT-http://otel:4318}
  OTEL_METRIC_EXPORT_INTERVAL: "15000"

x-service: &service
  build: &service-build
    context: .
    dockerfile: services/Dockerfile
  environment: &service-env
    <<: [*auth-env, *telemetry-env]
    SURREAL_URL: ws://surrealdb:8000
    SURREAL_NAMESPACE: ${SURREAL_NAMESPACE:?rode uv run python -m core.security keygen}
    SURREAL_DATABASE: ${SURREAL_DATABASE:?rode uv run python -m core.security keygen}
    SURREAL_USER: ${SURREAL_USER:?rode uv run python -m core.security keygen}
    SURREAL_PASSWORD: ${SURREAL_PASSWORD:?rode uv run python -m core.security keygen}
    # NATS com senha só quando o .env a traz (produção): o usuário dos serviços (README §5.7).
    NATS_USER: ${NATS_SERVICES_PASSWORD:+services}
    NATS_PASSWORD: ${NATS_SERVICES_PASSWORD:-}
    # Temporal do compose ou o Temporal Cloud (endereço, namespace e API key no .env); payloads cifrados com a chave.
    TEMPORAL_ADDRESS: ${TEMPORAL_ADDRESS:-temporal:7233}
    TEMPORAL_NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
    TEMPORAL_API_KEY: ${TEMPORAL_API_KEY:-}
    TEMPORAL_PAYLOAD_KEY: ${TEMPORAL_PAYLOAD_KEY:-}
    # Arquivos (README §5.14): o serviço fala com o armazenamento por dentro; o navegador, pelo endereço público.
    STORAGE_URL: http://storage:9000
    STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-http://localhost:9000}
    STORAGE_BUCKET: ${STORAGE_BUCKET:?rode uv run python -m core.security keygen}
    STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?rode uv run python -m core.security keygen}
    STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?rode uv run python -m core.security keygen}
    STORAGE_CORS_ORIGINS: ${STORAGE_CORS_ORIGINS:-${CORS_ORIGINS:-}}
    # Módulos de negócio instalados (README §9): vazio = todos. O svc-plans só lista estes.
    MODULES: ${MODULES:-}
  depends_on: &service-deps
    nats: { condition: service_healthy }
    surreal-init: { condition: service_completed_successfully }
    temporal: { condition: service_healthy }
    storage: { condition: service_healthy }
  # GET /health (core/telemetry.py) confere NATS, SurrealDB e Temporal do serviço.
  healthcheck: &service-health
    test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
    interval: 10s
    timeout: 5s
    start_period: 90s
    retries: 3
  restart: unless-stopped

volumes:
  nats-data:
  surreal-data:
  temporal-data:
  storage-data:
  camunda-data:

services:
  traefik:
    image: traefik:v3.7
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --accesslog=true
    ports: ["127.0.0.1:${GATEWAY_PORT:-8088}:80"]
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    restart: unless-stopped

  gateway:
    build:
      <<: *service-build
      args: { APP_DIR: gateway }
    environment:
      <<: [*auth-env, *telemetry-env]
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # O gateway tem usuário próprio no NATS, restrito (compose.prod.yaml): publica gatilhos e lê os avisos ao vivo.
      NATS_USER: ${NATS_GATEWAY_PASSWORD:+gateway}
      NATS_PASSWORD: ${NATS_GATEWAY_PASSWORD:-}
      # Só as rotas da plataforma e dos módulos instalados (README §9); vazio = todos os manifestos.
      MODULES: ${MODULES:-}
    depends_on:
      nats: { condition: service_healthy }
    healthcheck: *service-health
    restart: unless-stopped
    labels:
      traefik.enable: "true"
      traefik.http.routers.gateway.rule: "PathPrefix(`/api`) || Path(`/health`) || Path(`/docs`) || Path(`/openapi.json`)"
      traefik.http.routers.gateway.entrypoints: web
      # Sem o middleware buffering: ele guarda a resposta inteira e quebraria o streaming e o /api/v1/live
      # (README §5.10). O limite de 1 MiB no corpo fica no gateway, que lê o corpo em pedaços e recusa com 413.
      traefik.http.routers.gateway.middlewares: gateway-ratelimit
      traefik.http.middlewares.gateway-ratelimit.ratelimit.average: "50"
      traefik.http.middlewares.gateway-ratelimit.ratelimit.burst: "100"
      # Entrada (login, cadastro, senha esquecida): 20 por minuto por IP, além do bloqueio por conta do svc-identity.
      traefik.http.routers.gateway-auth.rule: "Path(`/api/v1/identity/login`) || Path(`/api/v1/identity/signup`) || PathPrefix(`/api/v1/identity/password/`)"
      traefik.http.routers.gateway-auth.entrypoints: web
      traefik.http.routers.gateway-auth.service: gateway
      traefik.http.routers.gateway-auth.middlewares: gateway-auth-ratelimit
      traefik.http.middlewares.gateway-auth-ratelimit.ratelimit.average: "20"
      traefik.http.middlewares.gateway-auth-ratelimit.ratelimit.period: "1m"
      traefik.http.middlewares.gateway-auth-ratelimit.ratelimit.burst: "10"
      traefik.http.services.gateway.loadbalancer.server.port: "8000"

  nats:
    image: nats:2.15-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports: ["127.0.0.1:4222:4222"]
    volumes: ["nats-data:/data"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8222/healthz"]
      interval: 3s
      retries: 30
    restart: unless-stopped

  # A imagem do SurrealDB roda como nonroot (uid 65532) e não tem shell; o volume nasce do root. Este passo (com a imagem
  # do curl, que já está aqui) ajusta o dono e sai.
  surreal-volume:
    image: curlimages/curl:8.22.0
    user: root
    entrypoint: ["sh", "-c", "chown -R 65532:65532 /data"]
    volumes: ["surreal-data:/data"]

  surrealdb:
    image: surrealdb/surrealdb:v3.3.0
    depends_on:
      surreal-volume: { condition: service_completed_successfully }
    command: ["start", "--user", "root", "--pass", "${SURREAL_ROOT_PASSWORD:?rode uv run python -m core.security keygen}", "surrealkv:/data/db"]
    ports: ["127.0.0.1:8000:8000"]
    volumes: ["surreal-data:/data"]
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://127.0.0.1:8000"]
      interval: 3s
      retries: 30
    restart: unless-stopped

  # Cria (ou atualiza a senha de) o usuário de banco dos serviços: menor privilégio, nunca root (README §5.7).
  surreal-init:
    image: curlimages/curl:8.22.0
    depends_on:
      surrealdb: { condition: service_healthy }
    environment:
      ROOT_PASSWORD: ${SURREAL_ROOT_PASSWORD:?rode uv run python -m core.security keygen}
      NS: ${SURREAL_NAMESPACE:?rode uv run python -m core.security keygen}
      DB: ${SURREAL_DATABASE:?rode uv run python -m core.security keygen}
      APP_USER: ${SURREAL_USER:?rode uv run python -m core.security keygen}
      APP_PASSWORD: ${SURREAL_PASSWORD:?rode uv run python -m core.security keygen}
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        reply=$$(curl -sS --fail-with-body -X POST http://surrealdb:8000/sql -u "root:$$ROOT_PASSWORD" \
          -H "Accept: application/json" \
          --data "DEFINE NAMESPACE IF NOT EXISTS $$NS; USE NS $$NS; DEFINE DATABASE IF NOT EXISTS $$DB; USE DB $$DB;
                  DEFINE USER OVERWRITE $$APP_USER ON DATABASE PASSWORD '$$APP_PASSWORD' ROLES EDITOR;")
        # O /sql responde 200 mesmo quando um statement falha: o erro vem como "status":"ERR" no corpo.
        if echo "$$reply" | grep -q '"status":"ERR"'; then echo "$$reply"; exit 1; fi
        echo "usuário $$APP_USER pronto em $$NS/$$DB"

  temporal:
    image: temporalio/temporal:1.9.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/home/temporal/temporal.db", "--ui-port", "8233"]
    ports: ["127.0.0.1:7233:7233", "127.0.0.1:8233:8233"]
    volumes: ["temporal-data:/home/temporal"]  # pasta do usuário da imagem: grava sem precisar de root
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233", "--command-timeout", "3s"]
      interval: 3s
      retries: 40
    restart: unless-stopped

  # Motor de processos BPMN (briefing.md §5): Camunda 8, com o armazenamento secundário em H2 dentro do volume. A API
  # fica só na rede interna (o svc-processos é o único cliente); 127.0.0.1:8082 é para depurar. Licença: livre em
  # desenvolvimento e teste; produção self-managed exige licença Enterprise (briefing.md §5.2).
  camunda:
    image: camunda/camunda:8.10.0
    profiles: [modules, processos]
    environment:
      CAMUNDA_DATA_SECONDARYSTORAGE_TYPE: rdbms
      CAMUNDA_DATA_SECONDARYSTORAGE_RDBMS_URL: jdbc:h2:file:/usr/local/camunda/data/camunda-h2;DB_CLOSE_ON_EXIT=FALSE
      CAMUNDA_DATA_SECONDARYSTORAGE_RDBMS_USERNAME: sa
      CAMUNDA_SECURITY_AUTHENTICATION_UNPROTECTEDAPI: "true"
      CAMUNDA_SECURITY_AUTHORIZATIONS_ENABLED: "false"
      JAVA_TOOL_OPTIONS: -Xmx1g
    ports: ["127.0.0.1:8082:8080"]
    volumes: ["camunda-data:/usr/local/camunda/data"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/v2/topology"]
      interval: 5s
      retries: 40
    restart: unless-stopped

  # Armazenamento compatível com S3 (README §5.14). O navegador envia e baixa direto daqui (localhost:9000), sempre
  # por link assinado pelo serviço; em produção, troque pelo S3/R2/B2 (STORAGE_URL e credenciais).
  storage:
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?rode uv run python -m core.security keygen}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:?rode uv run python -m core.security keygen}
      RUSTFS_CONSOLE_ENABLE: "false"
    ports: ["127.0.0.1:9000:9000"]
    volumes: ["storage-data:/data"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 3s
      retries: 30
    restart: unless-stopped

  # Caixa de e-mail de mentira (README §5.15): o svc-notify entrega aqui e nada sai para a internet. Os e-mails
  # aparecem em http://localhost:8025. Em produção, SMTP_URL aponta para o provedor de verdade (SES, Postmark...).
  mailpit:
    image: axllent/mailpit:v1.31.3
    ports: ["127.0.0.1:8025:8025"]  # só a tela; o SMTP (1025) fica na rede interna
    environment:
      # E-mail para <org>.<código>@entrada.localhost cai aqui também: o svc-integracoes é avisado e lê os anexos.
      MP_WEBHOOK_URL: http://svc-integracoes:8000/entrada/mailpit
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  # Só no ambiente local: o ERP de exemplo de uma empresa cliente, falando MCP (tests/mcp_erp.py), para conectar em
  # Integrações e dar ferramentas aos agentes: http://mcp-erp:8000/mcp com Authorization "Bearer erp-dev-token".
  mcp-erp:
    image: python:3.13-slim
    command: ["python", "/app/mcp_erp.py"]
    volumes: ["./tests/mcp_erp.py:/app/mcp_erp.py:ro"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/saude')"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  # Observabilidade local (README §5.18): Grafana com traces (Tempo), métricas (Prometheus) e logs (Loki) em
  # http://localhost:3000. Recebe OTLP do gateway e dos serviços pela rede interna (e do host em 127.0.0.1:4318).
  # Os dados somem quando o container é recriado. Em produção, OTEL_EXPORTER_OTLP_ENDPOINT aponta para o seu backend.
  otel:
    image: grafana/otel-lgtm:0.34.0
    ports: ["127.0.0.1:3000:3000", "127.0.0.1:4318:4318"]
    restart: unless-stopped

  # ── Serviços de negócio (acrescentados pelo service.sh) ──────────────────────

  svc-identity:
    <<: *service
    build: { <<: *service-build, args: { SERVICE: identity } }
    environment:
      <<: *service-env
      # Só o serviço de identidade emite tokens: é o único container com a chave privada (README §5.7).
      AUTH_PRIVATE_KEY: ${AUTH_PRIVATE_KEY:?rode uv run python -m core.security keygen}

  svc-ai:
    <<: *service
    build: { <<: *service-build, args: { SERVICE: ai } }
    environment:
      <<: *service-env
      # Só o svc-ai abre as chaves dos provedores de IA (README §5.11).
      AI_SECRETS_KEY: ${AI_SECRETS_KEY:?rode uv run python -m core.security keygen}
      PLATFORM_TENANT: ${PLATFORM_TENANT:-}

  svc-notify:
    <<: *service
    build: { <<: *service-build, args: { SERVICE: notify } }
    environment:
      <<: *service-env
      # Só o svc-notify fala com o servidor de e-mail (README §5.15).
      SMTP_URL: ${SMTP_URL:-smtp://mailpit:1025}
      MAIL_FROM: ${MAIL_FROM:-CV-Frame <nao-responda@cv-frame.local>}
      APP_URL: ${APP_URL:-http://localhost:5173}
      APP_NAME: ${APP_NAME:-CV-Frame}

  svc-webhooks:
    <<: *service
    build: { <<: *service-build, args: { SERVICE: webhooks } }
    environment:
      <<: *service-env
      # Só o svc-webhooks abre os segredos de assinatura dos endereços (README §5.16).
      WEBHOOKS_SECRETS_KEY: ${WEBHOOKS_SECRETS_KEY:?rode uv run python -m core.security keygen}

  svc-plans:
    <<: *service
    build: { <<: *service-build, args: { SERVICE: plans } }
    environment:
      <<: *service-env
      # Quem administra a plataforma gerencia os planos (README §5.17); a mesma organização do svc-ai.
      PLATFORM_TENANT: ${PLATFORM_TENANT:-}

  svc-conhecimento:
    <<: *service
    build: { <<: *service-build, args: { SERVICE: conhecimento } }
    profiles: [modules, conhecimento]  # módulo de negócio: sobe com COMPOSE_PROFILES (README §9)
    environment:
      <<: *service-env
      # Modelo do agente de briefing, como cadastrado no svc-ai (specs/conhecimento.md §3).
      CONHECIMENTO_MODEL: ${CONHECIMENTO_MODEL:-cv/agente}

  svc-processos:
    <<: *service
    build: { <<: *service-build, args: { SERVICE: processos } }
    profiles: [modules, processos]  # módulo de negócio: sobe com COMPOSE_PROFILES (README §9)
    environment:
      <<: *service-env
      # Modelo dos agentes de descoberta, descrição e desenho, como cadastrado no svc-ai (specs/processos.md §3).
      PROCESSOS_MODEL: ${PROCESSOS_MODEL:-cv/agente}
      PROCESSOS_DESENHO_MODEL: ${PROCESSOS_DESENHO_MODEL:-cv/desenho}  # edita o fluxo: pede um modelo mais forte
      CAMUNDA_URL: http://camunda:8080  # implanta e inicia; os workers dos pacotes também falam com o motor
    depends_on:
      <<: *service-deps
      camunda: { condition: service_healthy }

  svc-financeiro:
    <<: *service
    build: { <<: *service-build, args: { SERVICE: financeiro } }
    profiles: [modules, financeiro]  # módulo de negócio: sobe com COMPOSE_PROFILES (README §9)
    environment:
      <<: *service-env
      CAMUNDA_URL: http://camunda:8080  # o worker das ações financeiro.* (core/processes.py)
    depends_on:
      <<: *service-deps
      camunda: { condition: service_healthy }

  svc-integracoes:
    <<: *service
    build: { <<: *service-build, args: { SERVICE: integracoes } }
    profiles: [modules, integracoes]  # módulo de negócio: sobe com COMPOSE_PROFILES (README §9)
    environment:
      <<: *service-env
      INTEGRACOES_DOMINIO: ${INTEGRACOES_DOMINIO:-entrada.localhost}  # endereços das caixas de entrada
      # Local: o Mailpit avisa (webhook) e entrega o e-mail recebido; em produção, um provedor de entrada (spec §3).
      INTEGRACOES_MAILPIT_URL: http://mailpit:8025
      # Só este serviço cifra e abre as credenciais dos servidores MCP (as chamadas MCP saem daqui).
      INTEGRACOES_SECRETS_KEY: ${INTEGRACOES_SECRETS_KEY:?rode uv run python -m core.security keygen}

  svc-staff:
    <<: *service
    build: { <<: *service-build, args: { SERVICE: staff } }
    profiles: [modules, staff]  # módulo de negócio: sobe com COMPOSE_PROFILES (README §9)
    environment:
      <<: *service-env
      PLATFORM_TENANT: ${PLATFORM_TENANT:-}  # a organização da Cogniventure: quem é dela é staff (specs/staff.md)

  svc-agentes:
    <<: *service
    build: { <<: *service-build, args: { SERVICE: agentes } }
    profiles: [modules, agentes]  # módulo de negócio: sobe com COMPOSE_PROFILES (README §9)

  svc-juridico:
    <<: *service
    build: { <<: *service-build, args: { SERVICE: juridico } }
    profiles: [modules, juridico]  # módulo de negócio: sobe com COMPOSE_PROFILES (README §9)
    environment:
      <<: *service-env
      CAMUNDA_URL: http://camunda:8080  # o worker das ações juridico.* (core/processes.py)
    depends_on:
      <<: *service-deps
      camunda: { condition: service_healthy }

  svc-administrativo:
    <<: *service
    build: { <<: *service-build, args: { SERVICE: administrativo } }
    profiles: [modules, administrativo]  # módulo de negócio: sobe com COMPOSE_PROFILES (README §9)
    environment:
      <<: *service-env
      CAMUNDA_URL: http://camunda:8080  # o worker das ações administrativo.* (core/processes.py)
    depends_on:
      <<: *service-deps
      camunda: { condition: service_healthy }

  svc-vendas:
    <<: *service
    build: { <<: *service-build, args: { SERVICE: vendas } }
    profiles: [modules, vendas]  # módulo de negócio: sobe com COMPOSE_PROFILES (README §9)
    environment:
      <<: *service-env
      CAMUNDA_URL: http://camunda:8080  # o worker das ações vendas.* (core/processes.py)
    depends_on:
      <<: *service-deps
      camunda: { condition: service_healthy }

  svc-atendimento:
    <<: *service
    build: { <<: *service-build, args: { SERVICE: atendimento } }
    environment:  # da plataforma: sobe sempre, como o svc-notify (todo cliente fala com a Cogniventure)
      <<: *service-env
      PLATFORM_TENANT: ${PLATFORM_TENANT:-}  # a organização da Cogniventure não pede ajuda a si mesma
